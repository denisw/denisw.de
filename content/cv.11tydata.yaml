intro: |
  **I love developing software, and I'm passionate about doing it well.** I have been practicing and enjoying the craft professionally for over 10 years, and as a hobby for almost 20. Yet I am still always on the lookout for ways to improve, be it through reading, hands-on practice, or teaching others.

  My goal is to use my skills to help my colleagues and perhaps even the world at large to produce consistently high-quality software that solves real problems.

experience:
  - time: 2016 – Present
    title: Futurice
    subtitle:
      - Full-Stack Developer (2016 – 2019)
      - Senior Full-Stack Developer (2019 – 2022)
      - Principal Developer (2022 – Present)
    description: |
      - Built web and mobile frontends and backends for various clients using different technology stacks, among them React and React Native, Node.js, Java with Spring and Python with Django.

      - Acted as a Tech Lead in several projects, making architectural decisions, maintaining developer experience and setting guidelines with and for the team while doing hands-on coding.

      *Notable projects:*

      - **Bosch PRO360:** Helped architect and build Bosch Power Tools' core digital B2B services application and platform from scratch over four years, first as Lead Developer and then as Tech Lead. *(Tech stack: Java, Spring, Azure, Kafka, MongoDB, React, React Native)*

      - **EnBW GenAI in Customer Care:** Contributed to proof-of-concept GenAI applications for the company's customer care agents, not only by writing code but also by championing and implementing software engineering practices such as linting, automated testing and Continuous Delivery. *(Tech stack: Python, LangChain, FastAPI, Azure)*

  - time: 2013 – 2015
    title: Fraunhofer-Institut für Zuverlässigkeit und Mikrointegration (IZM)
    subtitle: [Developer Intern]
    description: |
      - Rewrote and significantly expanded a legacy PHP application for process planning and documentation.

      - Introduced unit and end-to-end testing, linting, CI/CD, and other good software engineering practices absent during the previous iteration of the software.

      - *Tech stack: Ruby, Rails, MS SQL Server, Cucumber*

