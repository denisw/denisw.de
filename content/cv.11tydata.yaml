misc: |
  I was born and raised in Germany, but my father is American (hence my English-sounding last name). I have both German and US citizenship.

  I have a wife and a one-year-old daughter.

  I love strategic (preferably cooperative) board games, point-and-click adventures, and other types of playful puzzle solving with friends and family.
